<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b7f8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Моя учёба</title>
<style>
:root{--bh:0;--bl:0%;--bg:#f6f3ee;--surface:#fff;--ink:#23211e;--muted:#7a746b;--line:#e4ded4;--accent:#3b6ea5;--hl:#fff1a6}
@media (prefers-color-scheme:dark){:root{--bg:#17191c;--surface:#202327;--ink:#ecebe8;--muted:#9a9a96;--line:#31353a;--accent:#7fb0e6;--hl:#6b5d12}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line);min-height:58px}
.top h1{font-size:20px;margin:0;font-weight:650}
.grow{flex:1}
.stitle{font-size:18px;font-weight:650;display:flex;gap:8px;align-items:center;min-width:0}
.status{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px;border-style:dashed}
.btn.danger{color:#c0392b}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;width:min(280px,40vw)}
.banner{margin:14px 20px 0;padding:10px 14px;border-radius:10px;background:var(--hl);color:#3a3000;font-size:14px}
@media (prefers-color-scheme:dark){.banner{color:#fff3c0}}
.stage{min-height:100vh;background:radial-gradient(900px 520px at 12% 8%,hsl(calc(176 + var(--bh)) 62% calc(61% + var(--bl))/.45),transparent 62%),radial-gradient(800px 560px at 92% 88%,hsl(calc(215 + var(--bh)) 72% calc(65% + var(--bl))/.38),transparent 60%),linear-gradient(140deg,hsl(calc(177 + var(--bh)) 47% calc(92% + var(--bl))) 0%,hsl(calc(184 + var(--bh)) 52% calc(82% + var(--bl))) 48%,hsl(calc(209 + var(--bh)) 68% calc(83% + var(--bl))) 100%);background-attachment:fixed}
@media (prefers-color-scheme:dark){.stage{background:radial-gradient(900px 520px at 12% 8%,hsl(calc(180 + var(--bh)) 65% calc(36% + var(--bl))/.35),transparent 62%),radial-gradient(800px 560px at 92% 88%,hsl(calc(220 + var(--bh)) 55% calc(43% + var(--bl))/.35),transparent 60%),linear-gradient(140deg,hsl(calc(191 + var(--bh)) 58% calc(13% + var(--bl))) 0%,hsl(calc(188 + var(--bh)) 59% calc(15% + var(--bl))) 50%,hsl(calc(214 + var(--bh)) 58% calc(18% + var(--bl))) 100%);background-attachment:fixed}}
.top.glass{background:rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom-color:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){.top.glass{background:rgba(8,28,36,.45);border-bottom-color:rgba(255,255,255,.08)}}
.resbox{max-width:800px;margin:0 auto;padding:16px 20px 0}
.canvas{position:relative;margin:0 auto;max-width:1400px;width:100%}
.card{position:absolute;width:var(--cw,176px);height:var(--ch,236px);border-radius:20px;padding:16px 14px 14px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;text-align:center;background:linear-gradient(165deg,hsl(var(--h) 52% 40%),hsl(var(--h) 58% 24%));color:#e6f6ff;border:1px solid rgba(190,230,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 26px rgba(5,40,70,.35);will-change:transform;rotate:var(--r);animation:bob var(--d) ease-in-out var(--t) infinite;transition:scale .15s,box-shadow .15s,opacity .35s,filter .35s}
.card:before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(190,230,255,.32);border-radius:14px;pointer-events:none}
.card:hover{scale:1.04;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 34px rgba(5,40,70,.45);z-index:5}
.card.drag{cursor:grabbing;scale:1.08;rotate:0deg;animation:none;z-index:20;box-shadow:0 24px 44px rgba(10,50,70,.35)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card .corner{position:absolute;top:13px;left:15px;font-size:15px}
.card .corner.br{top:auto;left:auto;bottom:13px;right:15px;rotate:180deg}
.card .emoji{font-size:54px;line-height:1;margin-top:34px}
.card .cname{font-weight:650;font-size:17px;line-height:1.25;margin-top:14px;overflow-wrap:anywhere;color:#eaf8ff;text-shadow:0 1px 8px rgba(0,30,60,.45);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12.5px;color:#a9d8f2;margin-top:auto;margin-bottom:10px}
.card .edit{position:absolute;top:8px;right:10px;border:0;background:transparent;opacity:0;cursor:pointer;font-size:15px;border-radius:8px;padding:2px 7px;z-index:2}
.card:hover .edit,.card .edit:focus{opacity:.85}
.card .edit:hover{background:rgba(255,255,255,.18)}
.stage.dim .card{opacity:.28;filter:blur(2px)}
.subj{min-height:100vh;color:#e6f6ff;background:linear-gradient(165deg,hsl(var(--h) 52% 40%),hsl(var(--h) 58% 24%));background-attachment:fixed;--ink:#e6f6ff;--muted:#a9d8f2;--line:rgba(190,230,255,.25);--surface:rgba(255,255,255,.08);--bg:rgba(255,255,255,.07);--accent:#9fd6ff;--hl:rgba(255,226,102,.38)}
.subj .top{background:hsl(var(--h) 52% 34%/.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.subj aside{background:rgba(255,255,255,.06)}
.subj .tools{background:hsl(var(--h) 55% 30%/.94)}
.subj .ti.on{background:rgba(255,255,255,.2);color:#fff}
.subj .ttl::placeholder{color:rgba(190,230,255,.45)}
.subj .btn.danger{color:#ffb9ad}
.subj .ed blockquote{background:rgba(255,205,90,.16)}
html,body{overflow-x:hidden;max-width:100%}
.subj{overflow-x:hidden;width:100%}
.split>*{min-width:0}
aside{min-width:0;overflow:hidden}
.ti{max-width:100%;display:block}
#main{min-width:0}
.ttl{min-width:0;text-overflow:ellipsis}
.ed{overflow-wrap:anywhere;word-break:break-word}
.ed table{max-width:100%;display:block;overflow-x:auto}
.stitle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.lift{scale:1.08;box-shadow:0 22px 40px rgba(5,40,70,.5);z-index:15}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn.ico{padding:0;width:38px;height:38px}
.toast{position:fixed;left:50%;bottom:26px;translate:-50% 0;background:rgba(10,30,45,.94);color:#e6f6ff;padding:10px 18px;border-radius:999px;z-index:300;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
@media (max-width:720px){
.top{padding:8px 12px;min-height:52px;gap:8px}
.subj .stitle{font-size:16px;flex:1 1 auto;min-width:0}
.split{min-height:calc(100vh - 52px)}
aside{display:flex;align-items:center;gap:8px;padding:8px 10px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#side{display:flex;gap:6px;flex:none}
.ti{width:auto;flex:none;max-width:62vw;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
aside .btn.wide{width:auto;margin:0;flex:none;white-space:nowrap;border-radius:999px;padding:7px 14px}
#main{padding:14px}
.ttl{font-size:24px}
.tools{flex-wrap:nowrap;overflow-x:auto;top:52px;-webkit-overflow-scrolling:touch}
.tools button{flex:none;min-height:40px;padding:6px 12px}
.tools .sep{flex:none}
.ed{font-size:16.5px;padding-bottom:140px}
.board-pad{padding:0}
}
@media (max-width:560px){
.brand-tx,.btl{display:none}
.btn.primary.add{padding:0;width:38px;height:38px}
.top.glass{gap:6px;padding:8px 10px}
.srch input{width:30vw}
.srch input:focus{width:48vw}
.card .emoji{font-size:44px;margin-top:28px}
.card .emoji svg{width:46px;height:46px}
.card .cname{font-size:15px;margin-top:10px}
.card .corner{font-size:13px}
.card .meta{font-size:11.5px}
.empty{padding:40px 16px}
}


.btn{border-radius:999px;padding:8px 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:filter .15s,transform .15s,border-color .15s,background .15s}
.btn.primary{background:linear-gradient(135deg,#1fb5ad,#3a86e0);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(30,120,200,.32)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.wide{border-radius:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.01em}
.brand-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#1fb5ad,#3a86e0);color:#fff;box-shadow:0 6px 14px rgba(30,120,200,.3)}
.srch{position:relative;display:flex;align-items:center;color:var(--muted)}
.srch svg{position:absolute;left:13px;pointer-events:none}
.srch input{width:min(250px,38vw);border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.4);border-radius:999px;padding:8px 14px 8px 38px;outline:none;color:var(--ink);transition:width .25s,box-shadow .2s,background .2s}
.srch input:focus{width:min(340px,52vw);background:rgba(255,255,255,.7);box-shadow:0 0 0 3px rgba(58,134,224,.28)}
@media (prefers-color-scheme:dark){.srch input{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.08)}.srch input:focus{background:rgba(255,255,255,.15)}}
.sw{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.4);border-radius:999px;padding:5px 14px 5px 6px;cursor:pointer;color:var(--ink);font-size:14px;transition:background .2s}
.sw:hover{background:rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){.sw{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.08)}.sw:hover{background:rgba(255,255,255,.15)}}
.sw .knob{position:relative;width:36px;height:21px;border-radius:999px;background:rgba(20,60,80,.28);transition:background .25s}
.sw .knob:after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.3,1.5,.5,1)}
.sw.on .knob{background:linear-gradient(90deg,#1fb5ad,#3a86e0)}
.sw.on .knob:after{transform:translateX(15px)}
.card .edit{width:28px;height:28px;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);top:9px;right:9px;transition:opacity .2s,background .2s}
.card .edit:hover{background:rgba(255,255,255,.32)}
.subj .btn:not(.primary){background:rgba(255,255,255,.1);border-color:rgba(190,230,255,.3)}
.subj .btn:not(.primary):hover{border-color:rgba(190,230,255,.7)}
@media (max-width:720px){.swl{display:none}.sw{padding:5px 6px}.srch input{width:32vw}.brand{font-size:17px}}

.subj #main{background:rgba(2,16,34,.38);border-radius:20px;margin:18px;width:auto;max-width:920px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.subj .tools{background:hsl(var(--h) 55% 18%/.96)}
@media (max-width:720px){.subj #main{margin:10px}}

.card.pop{animation:pop .65s cubic-bezier(.2,1.4,.4,1) var(--pd,0ms) backwards,bob var(--d) ease-in-out var(--t) infinite}
@keyframes pop{from{opacity:0;scale:.35;translate:0 50px}}
.fly{position:fixed;z-index:100;perspective:1500px;pointer-events:none;border-radius:20px;filter:drop-shadow(0 30px 50px rgba(0,20,50,.45))}
.fly-in{position:absolute;inset:0;transform-style:preserve-3d;border-radius:inherit}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit;overflow:hidden}
.card.face{cursor:default;animation:none}
.face.back{transform:rotateY(180deg);background:linear-gradient(165deg,hsl(var(--h) 52% 40%),hsl(var(--h) 58% 24%))}
.ring{position:fixed;width:80px;height:80px;border-radius:50%;border:3px solid hsl(var(--h) 90% 78%);box-shadow:0 0 34px hsl(var(--h) 90% 70%/.7),inset 0 0 24px hsl(var(--h) 90% 70%/.5);z-index:99;pointer-events:none}
.pt{position:fixed;width:7px;height:7px;border-radius:50%;background:hsl(var(--h) 95% 82%);box-shadow:0 0 12px hsl(var(--h) 95% 75%);z-index:101;pointer-events:none}
.enter .top{animation:dropIn .4s cubic-bezier(.2,.9,.3,1) calc(var(--ed,0s) + .02s) both}
.enter aside{animation:slideL .45s cubic-bezier(.2,.9,.3,1) calc(var(--ed,0s) + .08s) both}
.enter .ti{animation:slideL .4s cubic-bezier(.2,.9,.3,1) calc(var(--ed,0s) + .1s + var(--i,0)*35ms) both}
.enter #main{animation:riseIn .5s cubic-bezier(.2,.9,.3,1) calc(var(--ed,0s) + .08s) both}
@keyframes dropIn{from{opacity:0;translate:0 -26px}}
@keyframes slideL{from{opacity:0;translate:-30px 0}}
@keyframes riseIn{from{opacity:0;translate:0 30px;filter:blur(8px)}}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{color:var(--ink);margin:0 0 6px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:var(--accent)}
.res small{color:var(--muted);display:block}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--line);padding:14px;background:var(--surface)}
.ti{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti:hover{background:var(--bg)}
.ti.on{background:hsl(var(--h) 65% 92%);font-weight:600;color:#23211e}
@media (prefers-color-scheme:dark){.ti.on{background:hsl(var(--h) 25% 26%);color:var(--ink)}}
#main{padding:26px clamp(16px,4vw,48px);max-width:900px;width:100%}
.ttl{width:100%;border:0;background:transparent;font-size:30px;font-weight:700;outline:none;padding:4px 0;margin-bottom:10px}
.tools{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;position:sticky;top:64px;z-index:3;margin-bottom:14px}
.tools button{border:0;background:transparent;border-radius:8px;padding:5px 10px;cursor:pointer;min-width:34px}
.tools button:hover{background:var(--bg)}
.tools .sep{width:1px;background:var(--line);margin:3px 4px}
.ed{min-height:60vh;outline:none;font-size:17px;line-height:1.65;padding-bottom:80px}
.ed.empty-ed:before{content:attr(data-ph);color:var(--muted);pointer-events:none;position:absolute}
.ed h2{font-size:24px;margin:1.1em 0 .3em}
.ed h3{font-size:19px;margin:1em 0 .3em;color:var(--accent)}
.ed img{max-width:100%;height:auto;border-radius:10px;margin:8px 0;cursor:zoom-in;display:block}
.ed blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid #e0a526;background:rgba(224,165,38,.12);border-radius:0 10px 10px 0}
.ed mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.ed ul,.ed ol{padding-left:26px}
.foot{display:flex;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.modal input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:2px solid transparent;background:var(--bg);border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer}
.pick button.sel{border-color:var(--accent)}
.pick .hue{background:hsl(var(--h) 52% 40%)}
.pick button{display:inline-flex;align-items:center;justify-content:center}
svg{vertical-align:-3px}
.card .emoji svg{display:block;margin:0 auto}
.mrow{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.mrow .l{margin-right:auto}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}aside{border-right:0;border-bottom:1px solid var(--line)}.tools{top:58px}.search{width:36vw}}

.bgwrap{position:relative}
.bgpop{position:absolute;right:0;top:calc(100% + 10px);width:250px;padding:14px 16px 12px;border-radius:18px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);box-shadow:0 16px 40px rgba(10,50,80,.25);z-index:50;color:#16323f}
@media (prefers-color-scheme:dark){.bgpop{background:rgba(14,34,44,.92);border-color:rgba(255,255,255,.12);color:#e6f6ff}}
.bgpop[hidden]{display:none}
.bgpop label{display:block;font-size:12.5px;font-weight:600;margin:6px 0 6px;opacity:.8}
.bgpop input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;outline:none;margin:0 0 8px}
.bgpop input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid rgba(20,60,80,.45);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
.bgpop input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid rgba(20,60,80,.45);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
#bgh{background:linear-gradient(90deg,hsl(131 40% 58%),hsl(176 42% 58%),hsl(215 48% 62%),hsl(236 42% 64%))}
#bgl{background:linear-gradient(90deg,#27545c,#8fc9cf,#dff3f3)}
.bgpop .bgreset{width:100%;margin-top:4px;border:1px solid rgba(20,60,80,.25);background:transparent;color:inherit;border-radius:999px;padding:6px;cursor:pointer;font-size:13px}

.bgpop{width:292px}
.bgttl{font-size:13px;font-weight:700;margin:0 2px 10px;opacity:.85}
.bggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:min(60vh,420px);overflow:auto;-webkit-overflow-scrolling:touch}
.bgt{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:0;padding:0;cursor:pointer;background:#123 center/cover no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.25);outline:2px solid transparent;outline-offset:2px;transition:transform .15s,outline-color .15s}
.bgt:active{transform:scale(.96)}
.bgt.on{outline-color:#3a86e0}
.bgt span{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 4px;font-size:11px;font-weight:600;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.bgt.def{background:linear-gradient(140deg,#e2f5f4,#bfe6e8 48%,#b3d3f1)}
.bgt.def span{color:#0d3a44;background:none}
html[data-bg] .stage{background:none;position:relative;isolation:isolate;--ink:#eaf6ff;--muted:#b7d4e6}
html[data-bg] .stage::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(4,14,22,.25),rgba(4,14,22,.42)),var(--bgimg) center/cover no-repeat}
html[data-bg] .top.glass{background:rgba(8,20,30,.5);border-bottom-color:rgba(255,255,255,.12)}
html[data-bg] .srch input,html[data-bg] .sw{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.1)}
html[data-bg] .srch input::placeholder{color:#b7d4e6}
html[data-bg] .btn.ico{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#eaf6ff}
.tools{display:none!important}

/* красивые карточки: лого на всю карточку */

<div id="app"></div>
<script>
(function(){
"use strict";
var store={},listeners={},idb=null,lsTimer=null;
var ready=new Promise(function(resolve){
  function fromLS(){try{store=JSON.parse(localStorage.getItem("study-board-store")||"{}")}catch(e){store={}}resolve()}
  try{
    var rq=indexedDB.open("study-board",1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore("kv")};
    rq.onerror=function(){fromLS()};
    rq.onblocked=function(){fromLS()};
    rq.onsuccess=function(){
      idb=rq.result;
      try{
        var cur=idb.transaction("kv","readonly").objectStore("kv").openCursor();
        cur.onsuccess=function(){var c=cur.result;if(c){store[c.key]=c.value;c.continue()}else resolve()};
        cur.onerror=function(){resolve()};
      }catch(e){idb=null;fromLS()}
    };
  }catch(e){fromLS()}
});
function persist(path,del){
  if(idb){
    try{var os=idb.transaction("kv","readwrite").objectStore("kv");if(del)os.delete(path);else os.put(store[path],path)}catch(e){console.error(e)}
  }else{
    clearTimeout(lsTimer);
    lsTimer=setTimeout(function(){try{localStorage.setItem("study-board-store",JSON.stringify(store))}catch(e){console.error(e)}},300);
  }
}
function colOf(path){return path.slice(0,path.lastIndexOf("/"))}
function meta(){return{fromCache:false,hasPendingWrites:false}}
function snap(col){
  var ids=Object.keys(store).filter(function(k){return colOf(k)===col}).sort();
  var docs=ids.map(function(k){var d=store[k];return{id:k.slice(k.lastIndexOf("/")+1),exists:true,data:function(){return d},metadata:meta()}});
  return{docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return[]},metadata:meta()};
}
function notify(col){
  Promise.resolve().then(function(){
    (listeners[col]||[]).slice().forEach(function(l){try{l.next(snap(col))}catch(e){console.error(e)}});
  });
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function docRef(path){
  var col=colOf(path),id=path.slice(path.lastIndexOf("/")+1);
  return{
    id:id,path:path,
    get:function(){return ready.then(function(){var d=store[path];return{id:id,exists:!!d,data:function(){return d},metadata:meta()}})},
    set:function(data){return ready.then(function(){store[path]=JSON.parse(JSON.stringify(data));persist(path);notify(col)})},
    update:function(data){return ready.then(function(){store[path]=Object.assign({},store[path]||{},JSON.parse(JSON.stringify(data)));persist(path);notify(col)})},
    delete:function(){return ready.then(function(){delete store[path];persist(path,true);notify(col)})}
  };
}
var db={
  doc:function(path){return docRef(path)},
  collection:function(col){
    return{
      path:col,
      doc:function(id){return docRef(col+"/"+(id||uid()))},
      add:function(data){var r=docRef(col+"/"+uid());return r.set(data).then(function(){return r})},
      onSnapshot:function(next,err){
        var l={next:next};(listeners[col]=listeners[col]||[]).push(l);
        ready.then(function(){if((listeners[col]||[]).indexOf(l)>=0){try{next(snap(col))}catch(e){console.error(e)}}});
        return function(){listeners[col]=(listeners[col]||[]).filter(function(x){return x!==l})};
      }
    };
  }
};
window.claude={use:function(name){return Promise.resolve(name==="db"?db:null)}};
window.OFFLINE_API={
  exportAll:function(){return JSON.stringify({app:"study-board",v:1,saved:Date.now(),store:store})},
  importAll:function(text){
    return ready.then(function(){
      var o=JSON.parse(text);
      if(!o||typeof o.store!=="object")throw new Error("bad file");
      var n=0,cols={};
      Object.keys(o.store).forEach(function(k){
        if(!/^(subjects|topics)\/[A-Za-z0-9_.~:@+-]+$/.test(k))return;
        store[k]=o.store[k];persist(k);cols[colOf(k)]=1;n++;
      });
      Object.keys(cols).forEach(notify);
      return n;
    });
  }
};
})();
</script>
<script>
(function(){
"use strict";
/* Библиотека материала: content/library.json (обновляется через GitHub), мерджится в локальное хранилище */
function hash(s){var h=5381;s=String(s||"");for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
function okId(x){return /^[A-Za-z0-9_-]+$/.test(String(x))}
var busy=false;
async function sync(){
  if(busy)return;busy=true;
  try{
    var db=await window.claude.use("db");
    var lib=null;
    try{var r=await fetch("content/library.json?"+Date.now(),{cache:"no-store"});if(!r.ok)return;lib=await r.json()}catch(e){return}
    if(!lib||!Array.isArray(lib.subjects))return;
    var rev=String(lib.rev||"0");
    if(localStorage.getItem("sb-lib-rev")===rev)return;
    for(var si=0;si<lib.subjects.length;si++){
      var s=lib.subjects[si];if(!s||!okId(s.id))continue;
      var sid="lib-"+s.id,sref=db.doc("subjects/"+sid),sc=await sref.get(),sd=sc.exists?sc.data():{};
      await sref.set(Object.assign({},sd,{name:String(s.name||"Предмет"),emoji:s.emoji||"📘",hue:+s.hue||200,created:sd.created||(1700000000000+si*1000),lib:true}));
      var ts=Array.isArray(s.topics)?s.topics:[];
      for(var ti=0;ti<ts.length;ti++){
        var t=ts[ti];if(!t||!okId(t.id))continue;
        var tid="lib-"+s.id+"-"+t.id,tref=db.doc("topics/"+tid),tc=await tref.get(),h=hash(String(t.title||"Без названия")+"\u0000"+String(t.html||""));
        var base={subjectId:sid,title:String(t.title||"Без названия"),html:String(t.html||""),lib:true,libHash:h,created:1700000000000+si*100000+ti*1000,updated:Date.now()};
        if(!tc.exists){await tref.set(base)}
        else{
          var cur=tc.data();
          if(cur.libHash===h)continue;
          if(cur.libHash===hash(String(cur.title||"")+"\u0000"+String(cur.html||""))){await tref.set(Object.assign({},cur,{title:base.title,html:base.html,libHash:h,updated:Date.now()}))}
          else{
            var uref=db.doc("topics/"+tid+"-upd-"+rev.replace(/[^A-Za-z0-9_-]/g,""));
            if(!(await uref.get()).exists)await uref.set(Object.assign({},base,{title:base.title+" (обновление)",libHash:"",lib:false,created:cur.created+1}));
          }
        }
      }
    }
    localStorage.setItem("sb-lib-rev",rev);
  }catch(e){console.error(e)}finally{busy=false}
}
window.addEventListener("load",function(){setTimeout(sync,400)});
window.addEventListener("online",function(){sync()});
document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){var hadC=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadC&&!window.__rl){window.__rl=1;location.reload()}});navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){try{r.update()}catch(e){}}).catch(function(e){console.warn("sw",e)})});
}
})();
</script>

function icon(k,px){

  if(ICONS[k])return '<svg viewBox="0 0 64 64" width="'+px+'" height="'+px+'" aria-hidden="true">'+ICONS[k]+'</svg>';

var SAMPLES=[["Терапия","🫀",200],["Хирургия","🏥",345],["Педиатрия","👶",175],["Акушерство и гинекология","🤰",310],["Неврология","🧠",280],["Инфекционные болезни","🦠",160],["Фармакология","💊",235],["Патологическая анатомия","🔬",255]];

function plural(n,f){var a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f[2];if(b>1&&b<5)return f[1];if(b===1)return f[0];return f[2]}
function clean(html){
  var d=new DOMParser().parseFromString("<body>"+(html||""),"text/html");
  d.querySelectorAll("script,style,iframe,object,embed,link,meta,form,base").forEach(function(n){n.remove()});
  d.body.querySelectorAll("*").forEach(function(el){
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var n=a.name.toLowerCase();
      if(n.indexOf("on")===0)el.removeAttribute(a.name);
      else if((n==="href"||n==="src")&&/^\s*javascript:/i.test(a.value))el.removeAttribute(a.name);
    });
  });
  return d.body.innerHTML;
}

function sortedSubjects(){return Array.from(subjects.entries()).sort(function(a,b){return (a[1].created||0)-(b[1].created||0)})}
function topicsOf(sid){return Array.from(topics.entries()).filter(function(e){return e[1].subjectId===sid}).sort(function(a,b){return (a[1].created||0)-(b[1].created||0)})}

/* ---------- storage ---------- */
function queueSave(id,patch){
  var t=topics.get(id);if(!t)return;
  patch.updated=Date.now();
  topics.set(id,Object.assign({},t,patch));
  pend[id]=Object.assign(pend[id]||{},patch);
  setStatus("Сохраняю…");
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,800);
}
async function flush(){
  if(saving){saveTimer=setTimeout(flush,300);return}
  saving=true;
  var ids=Object.keys(pend),failed=false;
  for(var i=0;i<ids.length;i++){
    var id=ids[i];delete pend[id];
    if(!db||!topics.has(id))continue;
    try{await db.doc("topics/"+id).set(topics.get(id))}catch(e){failed=true;console.error(e)}
  }
  saving=false;
  if(Object.keys(pend).length)flush();
  else setStatus(failed?"Не удалось сохранить (слишком большая заметка?)":(db?"Сохранено ✓":"Только предпросмотр"));
}
async function saveSubject(id,data){

  subjects.set(id,full);onData();
  if(db){try{await db.doc("subjects/"+id).set(full)}catch(e){console.error(e);setStatus("Не удалось сохранить")}}
  return id;
}

}

  if(id)enterAnim=true;
  view.subject=id;view.topic=topic||null;
  try{var h=id?"s-"+id:"";if(location.hash.replace(/^#/,"")!==h)location.hash=h}catch(e){}

}
function fromHash(){var h=location.hash.replace(/^#s-/,"");return /^#s-/.test(location.hash)?h:null}
window.addEventListener("hashchange",function(){var id=fromHash();if(id!==view.subject){view.subject=id;view.topic=null;render()}});

/* ---------- render ---------- */
function bannerHTML(){
  if(offline)return '<div class="banner">Режим предпросмотра: хранилище недоступно, изменения не сохранятся после закрытия страницы.</div>';
  if(slow&&!loaded)return '<div class="banner">Хранилище отвечает долго… данные могут появиться чуть позже.</div>';

}
function render(){

  fr.onload=function(){window.OFFLINE_API.importAll(String(fr.result)).then(function(n){toast("Загружено записей: "+n)},function(){toast("Не удалось прочитать файл копии")})};
  fr.readAsText(f);e.target.value="";
});
var rsT=null;
window.addEventListener("resize",function(){clearTimeout(rsT);rsT=setTimeout(function(){if($("#grid"))refreshBoard()},200)});

function openWithAnim(card,id){
  var sb=subjects.get(id),g=$("#grid");
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!sb||!g||!card.animate||reduce){go(id);return}
  opening=true;
  var gr=g.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight;
  var dm=dmap[id],x=gr.left+(dm?dm.x:parseFloat(card.style.left)),y=gr.top+(dm?dm.y:parseFloat(card.style.top)),hue=+sb.hue||0;
  var rot=getComputedStyle(card).rotate;if(!rot||rot==="none")rot="0deg";
  var cx=x+CW/2,cy=y+CH/2;
  var fly=document.createElement("div");fly.className="fly";
  fly.style.cssText="--h:"+hue+";left:"+x+"px;top:"+y+"px;width:"+CW+"px;height:"+CH+"px;rotate:"+rot;
  var inner=document.createElement("div");inner.className="fly-in";
  var front=card.cloneNode(true),ed=front.querySelector(".edit");if(ed)ed.remove();
  front.removeAttribute("data-act");front.removeAttribute("tabindex");front.removeAttribute("role");
  front.className="card face front";
  front.style.cssText="--h:"+hue+";position:absolute;inset:0;left:0;top:0;width:100%;height:100%;rotate:0deg;animation:none";
  var back=document.createElement("div");back.className="face back";
  inner.appendChild(front);inner.appendChild(back);fly.appendChild(inner);document.body.appendChild(fly);
  var stage=$(".stage");if(stage)stage.classList.add("dim");
  card.style.visibility="hidden";
  var extras=[];
  function fx(cls,style){var d=document.createElement("div");d.className=cls;d.style.cssText="--h:"+hue+";"+style;document.body.appendChild(d);extras.push(d);return d}
  var ring=fx("ring","left:"+cx+"px;top:"+cy+"px");
  ring.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:.95},{transform:"translate(-50%,-50%) scale(30)",opacity:0}],{duration:800,easing:"cubic-bezier(.1,.7,.3,1)",fill:"forwards"});
  for(var i=0;i<18;i++){
    var ang=Math.random()*Math.PI*2,dist=140+Math.random()*260,pt=fx("pt","left:"+cx+"px;top:"+cy+"px");
    pt.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:"translate(calc(-50% + "+Math.cos(ang)*dist+"px),calc(-50% + "+Math.sin(ang)*dist+"px)) scale(.2)",opacity:0}],{duration:560+Math.random()*340,easing:"cubic-bezier(.1,.8,.3,1)",delay:80,fill:"both"});
  }
  var T=600,ease="cubic-bezier(.4,.02,.15,1)";
  fly.animate([{left:x+"px",top:y+"px",width:CW+"px",height:CH+"px",rotate:rot,borderRadius:"20px"},{left:"0px",top:"0px",width:W+"px",height:H+"px",rotate:"0deg",borderRadius:"0px"}],{duration:T,easing:ease,fill:"forwards"});
  fly.animate([{scale:1},{scale:1.06,offset:.3},{scale:1}],{duration:T,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
  inner.animate([{transform:"rotateY(0deg)"},{transform:"rotateY(180deg)"}],{duration:T,easing:ease,fill:"forwards"});
  var done=false;
  function cleanup(){if(done)return;done=true;fly.remove();extras.forEach(function(d){d.remove()});opening=false}
  setTimeout(function(){
    enterDelay="0.05s";go(id);
    setTimeout(function(){
      var b=fly.animate([{opacity:1},{opacity:0}],{duration:300,easing:"ease-in-out",fill:"forwards"});
      b.onfinish=cleanup;
    },30);
  },T);
  setTimeout(cleanup,T+1000);
}
var lastT=0;
function tick(t){
  requestAnimationFrame(tick);
  var g=$("#grid");
  if(!g||!driftOn||dragging||document.hidden||g.style.display==="none"){lastT=t;return}
  var dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  if(dt<=0)return;
  var cw=g.clientWidth,ch=parseFloat(g.style.height)||g.clientHeight,mx=Math.max(0,cw-CW-8),my=Math.max(0,ch-CH-20);
  var cards=g.querySelectorAll(".card");
  for(var i=0;i<cards.length;i++){
    var el=cards[i],id=el.getAttribute("data-id"),d=dmap[id];
    if(el._ax===undefined){
      el._ax=parseFloat(el.style.left)||0;el._ay=parseFloat(el.style.top)||0;
      if(d){d.x=el._ax;d.y=el._ay}
    }
    if(!d){var k=hashN(id);d=dmap[id]={x:el._ax,y:el._ay,vx:(k%2?1:-1)*(3+k%5),vy:(k%3?1:-1)*(2+k%4),k:1}}
    var target=el.matches(":hover")?0:1;
    d.k+=(target-d.k)*Math.min(1,dt*5);
    d.x+=d.vx*d.k*dt;d.y+=d.vy*d.k*dt;
    if(d.x<0){d.x=0;d.vx=Math.abs(d.vx)}else if(d.x>mx){d.x=mx;d.vx=-Math.abs(d.vx)}
    if(d.y<0){d.y=0;d.vy=Math.abs(d.vy)}else if(d.y>my){d.y=my;d.vy=-Math.abs(d.vy)}
    el.style.transform="translate3d("+(d.x-el._ax).toFixed(3)+"px,"+(d.y-el._ay).toFixed(3)+"px,0)";
  }
}
requestAnimationFrame(tick);

/* ---------- init ---------- */
async function init(){
  document.documentElement.style.setProperty("--cw",CW+"px");document.documentElement.style.setProperty("--ch",CH+"px");
  view.subject=fromHash();
  render();
  var slowT=setTimeout(function(){slow=true;if(!loaded)render()},10000);
  try{
    if(window.claude&&window.claude.use){db=await window.claude.use("db");assets=await window.claude.use("assets");try{dl=await window.claude.use("downloads")}catch(e2){dl=null}}
  }catch(e){db=null}
  if(!db){clearTimeout(slowT);offline=true;loaded=true;render();return}
  db.collection("subjects").onSnapshot(function(s){
    clearTimeout(slowT);
    subjects.clear();s.docs.forEach(function(d){subjects.set(d.id,d.data())});
    loaded=true;onData();
  },function(err){console.error(err);clearTimeout(slowT);offline=true;loaded=true;render()});
  db.collection("topics").onSnapshot(function(s){
    topics.clear();
    s.docs.forEach(function(d){var p=pend[d.id],data=d.data();topics.set(d.id,p?Object.assign({},data,p):data)});
    onData();
  },function(err){console.error(err)});
}
init();
})();
